name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned on purpose: a different Prettier release reformats differently
      # and CI would disagree with `make fmt` locally.
      - name: prettier
        run: npx --yes prettier@3.9.6 --check .
